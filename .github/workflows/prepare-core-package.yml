name: Prepare Core candidate package (temporary)
on:
  push:
    branches: [chore/compact-asset-grammar-20261011]
    paths: [.github/workflows/prepare-core-package.yml]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: chore/compact-asset-grammar-20261011
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run preflight
      - name: Commit deterministic built artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          if ! git diff --cached --quiet; then
            git commit -m "build(core): commit reproducible 1.6.4 distribution"
            git push origin HEAD:chore/compact-asset-grammar-20261011
          fi
