name: Temporary sync Core 1.5.2
on:
  push:
    branches: [feat/1.5.2-visual-picker-shell]
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: feat/1.5.2-visual-picker-shell
          fetch-depth: 0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "build: sync Core 1.5.2 dist"
          git push origin HEAD:feat/1.5.2-visual-picker-shell
