name: Validate

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Local-equivalent preflight
        run: npm run preflight
      - name: Deterministic build proof
        shell: bash
        run: |
          set -euo pipefail
          cp -a dist /tmp/rhi-ux-core-dist
          npm run clean
          npm run build
          diff -qr /tmp/rhi-ux-core-dist dist
      - name: Summary
        if: always()
        run: |
          {
            echo '## RHI UX Core validation'
            echo '- Public primitive contract: npm preflight'
            echo '- Ownership boundary: npm preflight'
            echo '- Deterministic build: verified'
            echo '- Runtime dependency: none'
          } >> "$GITHUB_STEP_SUMMARY"
