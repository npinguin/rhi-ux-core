name: Branch package refresh
on:
  push:
    branches: [chore/core-151-identity-cleanup]
permissions:
  contents: write
jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: { ref: chore/core-151-identity-cleanup }
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with: { node-version: '24' }
      - run: npm ci
      - run: npm run build
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add dist
          git commit -m "build: refresh Core 1.5.1 dist" || exit 0
          git push origin HEAD:chore/core-151-identity-cleanup
